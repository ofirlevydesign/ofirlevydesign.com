<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanzu Service Setup — Project Presentation</title>
  <style>
    :root { --bg:#111; --fg:#f5f2ec; --muted:#9d988f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background:var(--bg); color:var(--fg); }
    header { position: sticky; top: 0; background: rgba(17,17,17,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(245,242,236,0.15); padding: 14px 20px; z-index: 10; }
    h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
    p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .deck { max-width: 1200px; margin: 0 auto; padding: 18px; display: grid; gap: 18px; }
    img { width: 100%; height: auto; display: block; background: #fff; border: 1px solid rgba(245,242,236,0.2); }
  </style>
</head>
<body>
  <header>
    <h1>VMware Tanzu Service Setup — Project Presentation</h1>
    <p>Use browser zoom for details. Scroll through slides below.</p>
  </header>
  <main class="deck">
    <img src="TKGS_1.png" alt="Slide 1">
    <img src="TKGS_2.png" alt="Slide 2">
    <img src="TKGS_3.png" alt="Slide 3">
    <img src="TKGS_4.png" alt="Slide 4">
    <img src="TKGS_5.png" alt="Slide 5">
    <img src="TKGS_6.png" alt="Slide 6">
    <img src="TKGS_7.png" alt="Slide 7">
    <img src="TKGS_8.png" alt="Slide 8">
    <img src="TKGS_9.png" alt="Slide 9">
    <img src="TKGS_10.png" alt="Slide 10">
  </main>
</body>
</html>
